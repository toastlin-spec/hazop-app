<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>製程安全評估</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">PSA</span>
      <div>
        <div id="project-name" class="project-name">未命名專案</div>
        <div class="file-line"><span id="file-name"></span> · <span id="autosave">尚未自動保存</span></div>
      </div>
    </div>
    <div class="toolbar" role="toolbar" aria-label="專案操作">
      <button id="btn-new" type="button" class="btn ghost">新專案</button>
      <button id="btn-open" type="button" class="btn ghost">開啟…</button>
      <button id="btn-save" type="button" class="btn ghost" title="Ctrl+S">儲存</button>
      <button id="btn-saveas" type="button" class="btn ghost" title="Ctrl+Shift+S">另存新檔…</button>
      <button id="btn-undo" type="button" class="btn ghost" title="Ctrl+Z（不在輸入框時）" disabled>↶ 復原</button>
      <button id="btn-sample" type="button" class="btn ghost">載入範例</button>
    </div>
  </header>
  <div id="sample-banner" class="sample-banner" hidden>這是範例專案：所有數據皆為虛構教學數據，僅示範填寫方式，不可作為實際評估結果。開始正式評估請按「新專案」。</div>
  <div class="layout">
    <nav id="nav" class="sidebar" aria-label="工作表"></nav>
    <main id="main" class="main" tabindex="-1"></main>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="vendor/exceljs.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/hazop-calc.js"></script>
  <script src="js/views/overview.js"></script>
  <script src="js/views/checklists.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/areas.js"></script>
  <script src="js/views/hazop.js"></script>
  <script src="js/views/io.js"></script>
  <script src="js/export-xlsx.js"></script>
  <script src="js/import-xlsx.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
